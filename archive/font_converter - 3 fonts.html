<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Svensk ASCII Typsnittsgenerator (3 storlekar)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; background: #f9f9f9; color: #333; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; margin-top: 25px; cursor: pointer; width: 100%; font-size: 16px; border-radius: 4px; font-weight: bold; }
        button:hover { background: #218838; }
        .preview-box { margin-top: 25px; padding: 15px; background: #f0f0f0; border-radius: 6px; border: 1px dashed #bbb; text-align: center; }
        .preview-title { font-weight: bold; margin-bottom: 10px; display: block; }
        canvas { border: 1px solid #000; background: #fff; margin: 0 10px; image-rendering: pixelated; }
    </style>
</head>
<body>

<div class="container">
    <h2>Svensk ASCII Typsnittsgenerator</h2>
    <p>Skapar okomprimerade C-headerfiler (.h) för 32x64, 16x32 och 8x16.</p>

    <label for="fontStyle">Typsnitt (Skrivmaskinsstil):</label>
    <select id="fontStyle" onchange="updatePreview()">
        <option value="Courier New">Courier New (Standard Windows/Mac)</option>
        <option value="Courier">Courier</option>
        <option value="Prestige Elite">Prestige Elite</option>
        <option value="monospace">Standard Monospace</option>
    </select>

    <label for="fontSize">Basstorlek (anpassas automatiskt per font):</label>
    <input type="number" id="fontSize" value="46" oninput="updatePreview()">

    <label for="xOffset">X-offset:</label>
    <input type="number" id="xOffset" value="2" oninput="updatePreview()">

    <label for="yOffset">Y-offset:</label>
    <input type="number" id="yOffset" value="48" oninput="updatePreview()">

    <div class="preview-box">
        <span class="preview-title">Realtidsgranskning (32x64)</span>
        <div>
            <canvas id="previewCanvas1" width="32" height="64"></canvas>
            <canvas id="previewCanvas2" width="32" height="64"></canvas>
        </div>
        <small style="color: #666; display: block; margin-top: 5px;">Visar tecknen 'Ä' och 'g'</small>
    </div>

    <button onclick="generateAllFonts()">Generera och ladda ner alla tre .h-filer</button>
</div>

<script>
    const SWEDISH_ASCII_MAP = {
        0x5B: 'Ä', 0x5C: 'Ö', 0x5D: 'Å', 0x5E: 'Ü',
        0x7B: 'ä', 0x7C: 'ö', 0x7D: 'å', 0x7E: 'ü'
    };

    function drawCharToCanvas(canvasId, charStr) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const fontName = document.getElementById('fontStyle').value;
        const fontSize = parseInt(document.getElementById('fontSize').value, 10);
        const xOffset = parseInt(document.getElementById('xOffset').value, 10);
        const yOffset = parseInt(document.getElementById('yOffset').value, 10);

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, 32, 64);

        ctx.fillStyle = "#000000";
        ctx.font = `${fontSize}px "${fontName}"`;
        ctx.fillText(charStr, xOffset, yOffset);
    }

    function updatePreview() {
        drawCharToCanvas('previewCanvas1', 'Ä');
        drawCharToCanvas('previewCanvas2', 'g');
    }

    function generateFontHeader(w, h, baseFontSize, fontName, userXOffset, userYOffset) {
        const totalChars = 128;
        // Skala proportionellt utifrån basstorleken (som är optimerad för 64px höjd)
        const scale = h / 64;
        const fontSize = Math.round(baseFontSize * scale);
        const xOffset = Math.round(userXOffset * scale);
        const yOffset = Math.round(userYOffset * scale);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const guardName = `WIM_FONT_${w}X${h}_H`;
        let cCode = `#ifndef ${guardName}\n#define ${guardName}\n\n#include <stdint.h>\n\nconst uint8_t wim_font_${w}x${h}[128][${w * h}] = {\n`;

        for (let i = 0; i < totalChars; i++) {
            let charToDraw = " ";
            if (SWEDISH_ASCII_MAP[i]) {
                charToDraw = SWEDISH_ASCII_MAP[i];
            } else if (i >= 32 && i < 127) {
                charToDraw = String.fromCharCode(i);
            }

            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = "#000000";
            ctx.font = `${fontSize}px "${fontName}"`;
            ctx.fillText(charToDraw, xOffset, yOffset);

            const imgData = ctx.getImageData(0, 0, w, h).data;
            let charBytes = [];

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const brightness = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
                    const val = (brightness < 128) ? 0x00 : 0xFF;
                    charBytes.push("0x" + val.toString(16).toUpperCase().padStart(2, '0'));
                }
            }

            const cleanChar = (i >= 32 && i < 127) ? charToDraw : ' ';
            cCode += `    // Index 0x${i.toString(16).toUpperCase().padStart(2, '0')} ('${cleanChar}')\n    {\n        `;
            for (let b = 0; b < charBytes.length; b++) {
                cCode += charBytes[b] + (b === charBytes.length - 1 ? "" : ", ");
                if ((b + 1) % 12 === 0 && b !== charBytes.length - 1) {
                    cCode += "\n        ";
                }
            }
            cCode += "\n    },\n";
        }

        cCode += `};\n\n#endif // ${guardName}\n`;
        return { content: cCode, filename: `wim_font_${w}x${h}.h` };
    }

    function downloadFile(content, filename) {
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
    }

    function generateAllFonts() {
        const fontName = document.getElementById('fontStyle').value;
        const baseFontSize = parseInt(document.getElementById('fontSize').value, 10);
        const userXOffset = parseInt(document.getElementById('xOffset').value, 10);
        const userYOffset = parseInt(document.getElementById('yOffset').value, 10);

        const configs = [
            { w: 32, h: 64 },
            { w: 16, h: 32 },
            { w: 8, h: 16 }
        ];

        configs.forEach((cfg, index) => {
            const fontData = generateFontHeader(cfg.w, cfg.h, baseFontSize, fontName, userXOffset, userYOffset);
            // Fördröj nedladdningarna något så webbläsaren hinner med alla tre filer
            setTimeout(() => {
                downloadFile(fontData.content, fontData.filename);
            }, index * 300);
        });
    }

    window.onload = updatePreview;
</script>

</body>
</html>
